client_id = "167ac75cfad3d8a03bfd9ed283122cde"
name = "new-dock-seal-app"
application_url = "https://new-dock-seal-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_draft_orders,write_app_proxy"

[auth]
redirect_urls = [
  "https://new-dock-seal-app.onrender.com/auth/callback",
  "https://new-dock-seal-app.onrender.com/auth/shopify/callback",
  "https://new-dock-seal-app.onrender.com/api/auth/callback"
]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

[product.metafields.app.demo_info.access]
admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

[metaobjects.app.example.access]
admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[app_proxy]
url = "https://new-dock-seal-app.onrender.com/apps/dock-seal"
subpath = "dock-seal"
prefix = "apps"